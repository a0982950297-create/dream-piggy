<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>夢想撲滿</title>
    <link rel="stylesheet" href="style.css" />

    <!-- App Icon -->
    <link rel="apple-touch-icon" href="assets/icons/app-icon.png">
    <link rel="icon" type="image/png" href="assets/icons/app-icon.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="夢想撲滿">
    <meta name="theme-color" content="#f8e7df">

  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Dream Piggy</p>
          <h1>夢想撲滿</h1>
        </div>
        <div class="topbar-actions">
          <button
            id="menu-toggle"
            class="icon-button"
            type="button"
            aria-expanded="false"
            aria-controls="menu-panel"
          >
            更多
          </button>
          <div id="menu-panel" class="menu-panel hidden" role="menu">
            <button type="button" data-action="export">匯出備份</button>
            <button type="button" data-action="import">匯入備份</button>
            <button type="button" data-action="clear">清除資料</button>
          </div>
        </div>
      </header>

      <main class="main-content">
        <section id="home-view" class="view active">
          <section class="hero-card">
            <p class="hero-copy">把想去的地方，慢慢存成現實。</p>
            <div class="summary-grid">
              <article class="summary-item">
                <span class="summary-label">目前夢想豬</span>
                <strong id="active-count">0</strong>
              </article>
              <article class="summary-item">
                <span class="summary-label">總存入金額</span>
                <strong id="total-saved">NT$ 0</strong>
              </article>
            </div>
          </section>

          <section class="section-card">
            <div class="section-head">
              <div>
                <p class="section-kicker">夢想輪播</p>
                <h2>你的夢想豬</h2>
              </div>
              <button id="open-create-modal" class="primary-button" type="button">
                新增夢想
              </button>
            </div>

            <div id="carousel-area" class="carousel-area"></div>
          </section>
        </section>

        <section id="achievements-view" class="view">
          <section class="hero-card achievements-hero">
            <div class="summary-grid">
              <article class="summary-item">
                <span class="summary-label">完成夢想數</span>
                <strong id="achievement-count">0</strong>
              </article>
              <article class="summary-item">
                <span class="summary-label">累積完成金額</span>
                <strong id="achievement-total">NT$ 0</strong>
              </article>
            </div>
          </section>

          <section class="section-card">
            <div class="section-head">
              <div>
                <p class="section-kicker">成就館</p>
                <h2>完成收藏</h2>
              </div>
            </div>
            <div id="achievements-list" class="achievements-list"></div>
          </section>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="主要頁面">
        <button class="nav-button active" type="button" data-view="home">
          首頁
        </button>
        <button class="nav-button" type="button" data-view="achievements">
          成就館
        </button>
      </nav>
    </div>

    <div id="dialog-bubble" class="dialog-bubble hidden" aria-live="polite"></div>

    <div id="create-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="create"></div>
      <div class="modal-panel">
        <div class="modal-head">
          <div>
            <p class="section-kicker">新增夢想</p>
            <h3>建立夢想豬</h3>
          </div>
          <button class="icon-button subtle" type="button" data-close-modal="create">
            關閉
          </button>
        </div>

        <form id="create-form" class="form-stack">
          <label class="field">
            <span>夢想名稱</span>
            <input
              id="dream-name"
              name="name"
              type="text"
              maxlength="20"
              placeholder="例如：去東京看櫻花"
              required
            />
          </label>

          <label class="field">
            <span>目標金額</span>
            <input
              id="target-amount"
              name="targetAmount"
              type="number"
              min="1"
              step="1"
              inputmode="numeric"
              placeholder="例如：30000"
              required
            />
          </label>

          <fieldset class="field">
            <legend>選擇豬款</legend>
            <div id="pig-type-options" class="pig-type-options"></div>
          </fieldset>

          <button class="primary-button submit-button" type="submit">
            建立夢想豬
          </button>
        </form>
      </div>
    </div>

    <div id="feed-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="feed"></div>
      <div class="modal-panel">
        <div class="modal-head">
          <div>
            <p class="section-kicker">餵豬</p>
            <h3 id="feed-modal-title">要餵多少給夢想呢？</h3>
          </div>
          <button class="icon-button subtle" type="button" data-close-modal="feed">
            關閉
          </button>
        </div>

        <form id="feed-form" class="form-stack">
          <label class="field">
            <span>投入金額</span>
            <input
              id="feed-amount"
              name="feedAmount"
              type="number"
              min="1"
              step="1"
              inputmode="numeric"
              placeholder="例如：500"
              required
            />
          </label>
          <button class="primary-button submit-button" type="submit">
            投入夢想
          </button>
        </form>
      </div>
    </div>

    <div id="confirm-modal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="confirm"></div>
      <div class="modal-panel small">
        <div class="modal-head">
          <div>
            <p class="section-kicker">確認操作</p>
            <h3 id="confirm-title">請再確認一次</h3>
          </div>
        </div>
        <p id="confirm-message" class="confirm-message"></p>
        <div class="confirm-actions">
          <button id="confirm-cancel" class="secondary-button" type="button">
            取消
          </button>
          <button id="confirm-accept" class="primary-button" type="button">
            確認
          </button>
        </div>
      </div>
    </div>

    <input id="import-file-input" type="file" accept="application/json" hidden />

    <script src="app.js" defer></script>
  </body>
</html>
